<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Python Calculator</title>
    <!-- 1. STYLING (THE LOOK) -->
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 350px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
            opacity: 0.7;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: white;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #4f46e5;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            border: 1px dashed var(--primary);
        }

        /* COMMENTS FOR LEARNING */
        /* CSS makes things look good, but it doesn't "do" math. */
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Python AI Calc</h1>
        
        <div class="input-group">
            <label>Number 1</label>
            <input type="number" id="num1" placeholder="First number">
        </div>

        <div class="input-group">
            <label>Operation</label>
            <select id="operation">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (*)</option>
                <option value="divide">Division (/)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Number 2</label>
            <input type="number" id="num2" placeholder="Second number">
        </div>

        <button onclick="sendToPython()">Calculate on Backend</button>

        <div id="result">Result will appear here</div>
    </div>

    <!-- 2. JAVASCRIPT (THE BRIDGE) -->
    <script>
        // This function "bridges" the gap between the Browser and the Server.
        async function sendToPython() {
            // A. COLLECT: We get the values you typed in the boxes.
            const n1 = document.getElementById('num1').value;
            const n2 = document.getElementById('num2').value;
            const op = document.getElementById('operation').value;

            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "Calculating...";

            // B. SEND: The 'fetch' command sends a message to the Python server.
            // We are sending it to the '/calculate' route we created in main.py.
            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        num1: n1,
                        num2: n2,
                        operation: op
                    })
                });

                // C. RECEIVE: We wait for Python to send back the answer.
                const data = await response.json();

                // D. DISPLAY: We update the HTML page with the result.
                resultDiv.innerText = `Result: ${data.result}`;
            } catch (error) {
                resultDiv.innerText = "Error connecting to server!";
                console.error('Error:', error);
            }
        }
    </script>

</body>
</html>

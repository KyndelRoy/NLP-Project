<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Resource Language Topic Detector</title>
    <meta name="description" content="AI-powered topic detection for low-resource languages.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="main-content">
        <div class="theme-toggle-container">
            <button class="theme-btn" data-theme="light">Light Mode</button>
            <button class="theme-btn active" data-theme="dark">Dark Mode</button>
        </div>

        <header class="greeting-container">
            <h2 class="greeting-title">Low Resource Language<br>Topic Detector</h2>
            <p class="support-note">Currently supports English, Tagalog, and Cebuano</p>
        </header>

        <div class="prompt-wrapper">
            <div class="prompt-bar">
                <textarea id="text-input" placeholder="Enter text to classify..."
                    aria-label="Text to classify"></textarea>
                <div class="prompt-footer">
                    <div class="model-picker">
                        <div class="custom-dropdown" id="model-dropdown">
                            <div class="dropdown-trigger">
                                <span id="selected-model-text">BART-Large-MNLI</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </div>
                            <div class="dropdown-options" id="dropdown-options">
                                <div class="option active" data-value="bart">BART-Large-MNLI</div>
                                <div class="option" data-value="specialized">Latent Dirichlet Allocation</div>
                                <div class="option" data-value="fast">BERTopic</div>
                                <div class="option" data-value="language">Language Detection</div>
                            </div>
                            <input type="hidden" id="model-select" value="bart">
                        </div>
                    </div>
                    <button id="send-btn" type="button" title="Send Analysis" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                            style="transform: rotate(45deg); margin-right: 2px; margin-top: -2px;">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="char-count"><span id="current-chars">0</span> characters</div>
        </div>

        <section class="results-area">
            <div id="results-content">
                <!-- Analysis results will appear here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>

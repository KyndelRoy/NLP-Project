<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Resource Language Topic Detector</title>
    <meta name="description" content="AI-powered topic detection for low-resource languages.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="main-content">
        <header class="greeting-container">
            <h2 class="greeting-title">Low Resource Language<br>Topic Detector</h2>
            <p class="support-note">Currently supports English, Tagalog, and Cebuano</p>
        </header>

        <div class="prompt-wrapper">
            <div class="prompt-bar">
                <textarea id="text-input" placeholder="Enter text to classify..." aria-label="Text to classify"></textarea>
                <div class="prompt-footer">
                    <div class="model-picker">
                        <select id="model-select" aria-label="Select Classification Model">
                            <option value="bart">BART-Large-MNLI</option>
                            <option value="specialized">Specialized Multilingual</option>
                            <option value="fast">Fast Classification</option>
                        </select>
                    </div>
                    <button id="send-btn" type="button" title="Send Analysis">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="char-count"><span id="current-chars">0</span> characters</div>
        </div>

        <section class="results-area">
            <div id="results-content">
                <!-- Analysis results will appear here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Resource Language Topic Detector</title>
    <meta name="description" content="AI-powered topic detection for low-resource languages.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="main-content">
        <div class="theme-toggle-container">
            <button id="view-tools-btn" class="theme-btn" type="button">Tools</button>
            <button class="theme-btn" data-theme="light">Light Mode</button>
            <button class="theme-btn active" data-theme="dark">Dark Mode</button>
        </div>

        <header class="greeting-container">
            <h2 class="greeting-title" id="greeting-title">Low Resource Language<br>Topic Detector</h2>
            <p class="support-note">Currently supports English, Tagalog, and Cebuano</p>
        </header>

        <div class="prompt-wrapper">
            <div class="prompt-bar">
                <textarea id="text-input" placeholder="Enter text to classify..."
                    aria-label="Text to classify"></textarea>
                <div class="prompt-footer">
                    <div class="model-picker">
                        <div class="custom-dropdown" id="model-dropdown">
                            <div class="dropdown-trigger">
                                <span id="selected-model-text">BART-Large-MNLI</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </div>
                            <div class="dropdown-options" id="dropdown-options">
                                <div class="option active" data-value="bart">BART-Large-MNLI</div>
                                <div class="option" data-value="lda">Latent Dirichlet Allocation</div>
                                <div class="option" data-value="bertopic_en">BERTopic (English)</div>
                                <div class="option" data-value="bertopic_en_tl">BERTopic (EN + TL)</div>
                                <div class="option" data-value="bertopic_tri">BERTopic (Trilingual)</div>
                                <div class="option" data-value="language">Language Detection</div>
                            </div>
                            <input type="hidden" id="model-select" value="bart">
                        </div>
                        <button id="view-code-btn" class="view-code-btn" type="button">View Code</button>
                        <button id="view-dataset-btn" class="view-code-btn" type="button">View Dataset</button>
                    </div>
                    <button id="send-btn" type="button" title="Send Analysis" disabled>
                        <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="char-count"><span id="current-chars">0</span> characters</div>
        </div>

        <!-- Shared modal shell for code, dataset, and tool previews. -->
        <section id="code-viewer" class="code-modal" hidden aria-modal="true" role="dialog"
            aria-labelledby="code-viewer-title">
            <div class="code-modal-backdrop" data-close-code></div>
            <div class="code-modal-panel">
                <div class="code-viewer-header">
                    <h3 id="code-viewer-title">BART-Large-MNLI Code</h3>
                    <div class="code-viewer-actions">
                        <div id="tools-code-tabs" class="tools-code-tabs" hidden></div>
                        <button id="modal-dataset-switch-btn" class="dataset-switch-btn" type="button" hidden>
                            View Original 3-Column Dataset
                        </button>
                        <button id="close-code-btn" class="close-code-btn" type="button"
                            aria-label="Exit code viewer">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M18 6 6 18"></path>
                                <path d="m6 6 12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <pre class="code-block"><code id="code-viewer-content"></code></pre>
                <div id="dataset-viewer-content" class="dataset-viewer-content" hidden></div>
            </div>
        </section>

        <section class="results-area">
            <div id="results-content">
                <!-- Analysis results will appear here -->
            </div>
        </section>
    </main>

    <script src="js/code-snippets.js"></script>
    <script src="js/dataset-previews.js"></script>
    <script src="js/app-utils.js"></script>
    <script src="js/viewer.js"></script>
    <script src="js/results-view.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
